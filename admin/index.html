<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Orders — Sweeter Side admin</title>
<meta name="robots" content="noindex, nofollow">
<link rel="icon" href="/assets/Sweeter%20Side%20-%20PNG.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Nunito:wght@400;600;700&display=swap">
<link rel="stylesheet" href="/admin/admin.css">
</head>
<body>

<header class="topbar">
  <div class="topbar__inner">
    <img class="topbar__logo" src="/assets/Sweeter%20Side%20-%20PNG.png" alt="" width="1563" height="1563">
    <h1 class="topbar__title">Menu admin</h1>
    <nav class="topbar__nav" aria-label="Admin pages">
      <a href="/admin" aria-current="page">Orders</a>
      <a href="/admin/items">Items</a>
      <a href="/admin/vouchers">Vouchers</a>
      <a href="/admin/cakes">Cakes <span class="nav__n" id="nav-cakes-n" hidden></span></a>
    </nav>
    <div class="topbar__spacer"></div>
    <a class="shop-pill" id="shop-pill" href="/admin#shop" hidden></a>
    <span class="topbar__user" id="who"></span>
    <a class="btn btn--ghost" href="/" target="_blank" rel="noopener">View menu</a>
    <button class="btn btn--ghost" type="button" id="signout">Sign out</button>
  </div>
</header>

<main class="admin">
  <p class="alert" id="page-error" role="alert" hidden></p>

  <!-- Closed: customers can browse the menu but not order. Cake bookings are not affected. -->
  <section class="shop" id="shop" aria-labelledby="shop-title">
    <div class="shop__main">
      <h2 class="shop__title" id="shop-title">Shop</h2>
      <div class="shop__switch" role="group" aria-label="Shop open or closed">
        <button class="shop__btn" type="button" data-shop="open" aria-pressed="false">Open</button>
        <button class="shop__btn" type="button" data-shop="closed" aria-pressed="false">Closed</button>
      </div>
      <p class="shop__state" id="shop-state"></p>
    </div>
    <div class="field shop__note">
      <label for="closed-note">Closed note <span class="hint">(shown on the menu while closed, e.g. Back tomorrow at 10 AM)</span></label>
      <input id="closed-note" type="text" maxlength="120" placeholder="We're closed right now. You can still look through the menu.">
      <p class="field__err" id="closed-note-err" hidden></p>
    </div>
  </section>

  <section class="orders" aria-labelledby="orders-title">
    <div class="admin__head">
      <div>
        <h2 class="admin__title" id="orders-title">Orders</h2>
        <p class="admin__sub" id="orders-summary">Loading…</p>
      </div>
      <form class="fee" id="fee-form" novalidate>
        <fieldset class="fee__types">
          <legend>Taking orders for</legend>
          <label class="fee__check"><input type="checkbox" id="on-delivery"> Delivery</label>
          <label class="fee__check"><input type="checkbox" id="on-pickup"> Pick-up</label>
          <label class="fee__check"><input type="checkbox" id="on-dinein"> Dine-in</label>
        </fieldset>
        <div class="field">
          <label for="fee">Delivery fee (Php)</label>
          <input id="fee" name="delivery_fee" type="number" min="0" max="10000" step="1" inputmode="numeric" required>
        </div>
        <div class="field">
          <label for="pickup-open">Pick-up from</label>
          <input id="pickup-open" name="pickup_open" type="time" step="900" required>
        </div>
        <div class="field">
          <label for="pickup-close">Pick-up until</label>
          <input id="pickup-close" name="pickup_close" type="time" step="900" required>
        </div>
        <button class="btn btn--ghost" type="submit" id="fee-save">Save</button>
      </form>
    </div>
    <p class="field__err fee__err" id="fee-err" hidden></p>

    <div class="tabs" role="group" aria-label="Which orders to show">
      <button class="tab" type="button" data-show="active" aria-pressed="true">To do <span class="tab__n" id="n-active">0</span></button>
      <button class="tab" type="button" data-show="finished" aria-pressed="false">Finished <span class="tab__n" id="n-finished">0</span></button>
    </div>

    <ul class="orders__list" id="orders"></ul>
    <p class="empty-note" id="orders-empty" hidden></p>
  </section>
</main>

<div class="toast" id="toast" role="status" aria-live="polite" hidden></div>

<script src="/admin/common.js" defer></script>
<script src="/admin/orders.js" defer></script>
</body>
</html>
